#******************************************************************************
#
#     File Name: openocd/s32k144.cfg
#     Description: OpenOCD target configuration for NXP S32K144
#
#     Target MCU : NXP S32K144 (ARM Cortex-M4F @ up to 112 MHz)
#     Debug probe: PEMicro OpenSDA (CMSIS-DAP) — onboard on S32K144EVB-Q100
#     OpenOCD    : 0.11.0+
#     Author     : Mohammad Rashiqul Alam
#
#     GDB server : localhost:3333
#     Telnet     : localhost:4444
#
#******************************************************************************

# --- Interface: PEMicro OpenSDA via CMSIS-DAP ---
source [find interface/cmsis-dap.cfg]

transport select swd

# swj_newdap is defined in swj-dp.cfg (not a built-in command)
source [find target/swj-dp.tcl]

# --- Target: ARM Cortex-M4 ---
set CHIPNAME    s32k144
set CPUTAPID    0x4BA00477  ;# Standard ARM Cortex-M4 DAP ID

swj_newdap $CHIPNAME cpu -irlen 4 -expected-id $CPUTAPID
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu

target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap

# Work area: top of SRAM_L — safe for flash algorithm, away from app stack
# S32K144 SRAM: 0x1FFF8000–0x2001FFFF (64 KB + 96 KB)
$CHIPNAME.cpu configure \
    -work-area-phys 0x20006000 \
    -work-area-size 0x2000 \
    -work-area-backup 0

# --- Flash: 512 KB program flash (FTFC — Kinetis-compatible) ---
# Used by `make flash`. Safe to leave in gdb-server mode too.
flash bank $CHIPNAME.pflash kinetis 0x00000000 0x00080000 0 0 $CHIPNAME.cpu

# --- Adapter ---
adapter speed 1000

# S32K144EVB has SRST wired through OpenSDA — nogate allows GDB attach
# without asserting reset on the target
reset_config srst_nogate

# Force hardware breakpoints so flash code can be debugged
gdb_breakpoint_override hard
