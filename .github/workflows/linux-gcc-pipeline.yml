name: Linux GCC Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

env:
  BUILD_TYPE: Release
  CMAKE_VERSION: 3.23.0
  GCC_VERSION: 11
  # Opt into Node.js 24 now — GitHub is deprecating Node.js 20 actions
  # (forced cutover June 2nd, 2026). actions/checkout@v4 and
  # actions/upload-artifact@v4 are already compatible with Node.js 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  compliance-checks:
    name: Repository Compliance & Git History
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for linear history check
      
      - name: Check required files exist
        run: |
          echo "🔍 Checking repository compliance..."
          
          required_files=(
            "README.md"
            "LICENSE"
            "CMakeLists.txt"
            ".clang-format"
          )
          
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done
          
          if [ ${#missing_files[@]} -ne 0 ]; then
            echo "❌ Missing required files:"
            printf '  - %s\n' "${missing_files[@]}"
            exit 1
          fi
          
          echo "✅ All required files present"
      
      - name: Check for linear git history
        run: |
          echo "🔍 Checking for linear git history..."
          
          # Get the base and head branches
          base_branch="${{ github.base_ref }}"
          head_branch="${{ github.head_ref }}"
          
          # Fetch both branches
          git fetch origin "$base_branch"
          git fetch origin "$head_branch"
          
          # Check if PR branch has merge commits (excluding merges from base)
          # Use the actual PR branch, not HEAD which might be a GitHub merge commit
          merge_commits=$(git log --merges --oneline "origin/$base_branch..origin/$head_branch" | wc -l)
          
          if [ "$merge_commits" -gt 0 ]; then
            echo "❌ Non-linear history detected. Found $merge_commits merge commit(s)."
            echo "Please rebase your branch on top of $base_branch"
            git log --merges --oneline "origin/$base_branch..origin/$head_branch"
            exit 1
          fi
          
          echo "✅ Linear git history verified"
      
      - name: Check commit messages
        run: |
          echo "🔍 Checking commit message format..."
          
          base_branch="${{ github.base_ref }}"
          
          # Check each commit message in the PR
          git log origin/$base_branch..HEAD --format=%s | while read -r msg; do
            if [ ${#msg} -lt 10 ]; then
              echo "❌ Commit message too short (< 10 chars): '$msg'"
              exit 1
            fi
            if [ ${#msg} -gt 100 ]; then
              echo "⚠️  Warning: Commit message too long (> 100 chars): '$msg'"
            fi
          done
          
          echo "✅ Commit messages validated"

  environment-check:
    name: Environment Setup & Validation
    runs-on: ubuntu-latest
    needs: compliance-checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 100
      
      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            clang-format \
            shellcheck
      
      - name: Install Conan
        run: |
          pip3 install "conan>=2.0"
          conan --version
      
      - name: Verify environment
        run: |
          echo "🔍 Verifying build environment..."
          echo ""
          echo "GCC Version:"
          gcc --version | head -n1
          echo ""
          echo "G++ Version:"
          g++ --version | head -n1
          echo ""
          echo "CMake Version:"
          cmake --version | head -n1
          echo ""
          echo "Python Version:"
          python3 --version
          echo ""
          echo "Conan Version:"
          conan --version
          echo ""
          echo "Clang-Format Version:"
          clang-format --version
          echo ""
          echo "Shellcheck Version:"
          shellcheck --version | head -n1
          echo ""
          echo "✅ Environment validated"

  lint-check:
    name: Code Format Verification (clang-format & shellcheck)
    runs-on: ubuntu-latest
    needs: environment-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install linting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format shellcheck
      
      - name: Run shellcheck on scripts
        run: |
          echo "🐚 Running shellcheck on shell scripts..."
          
          # Find all shell scripts
          scripts=$(find scripts -type f -name "*.sh" 2>/dev/null || true)
          
          if [ -z "$scripts" ]; then
            echo "⚠️  No shell scripts found to check"
          else
            echo "Checking scripts:"
            echo "$scripts"
            echo ""
            
            shellcheck_errors=0
            for script in $scripts; do
              if ! shellcheck "$script"; then
                echo "❌ Shellcheck failed for: $script"
                shellcheck_errors=$((shellcheck_errors + 1))
              fi
            done
            
            if [ $shellcheck_errors -gt 0 ]; then
              echo ""
              echo "❌ Shellcheck found $shellcheck_errors file(s) with issues"
              exit 1
            fi
            
            echo "✅ All shell scripts passed shellcheck"
          fi
          echo ""
      
      - name: Run clang-format check
        run: |
          echo "🔍 Running clang-format check..."
          
          # Find all C/C++ source files.
          # Exclude src/bsp/ — NXP RTD drivers and platform SDK are vendor
          # code and must not be reformatted.
          files=$(find src test include -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            ! -path "src/bsp/*" \
            2>/dev/null || true)
          
          if [ -z "$files" ]; then
            echo "⚠️  No C/C++ files found to check"
            exit 0
          fi
          
          echo "Checking files:"
          echo "$files"
          echo ""
          
          # Check formatting
          format_errors=0
          for file in $files; do
            if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
              echo "❌ Format error in: $file"
              echo "   Run: clang-format -i $file"
              format_errors=$((format_errors + 1))
            fi
          done
          
          if [ $format_errors -gt 0 ]; then
            echo ""
            echo "❌ Found $format_errors file(s) with formatting issues"
            echo "Please run 'clang-format -i' on the affected files"
            exit 1
          fi
          
          echo "✅ All files are properly formatted"

  arm-build:
    name: ARM Cross-Compilation Build (S32K144)
    runs-on: ubuntu-latest
    needs: lint-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install ARM GCC Toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi ninja-build

      - name: Install Poetry
        run: |
          pip3 install poetry
          poetry --version

      - name: Install Conan in Poetry's virtualenv
        run: |
          poetry run pip install "conan>=2.0"
          poetry run conan --version

      - name: Setup Conan default profile
        run: |
          echo "Creating default Conan profile..."
          poetry run conan profile detect --force
          echo "✅ Default Conan profile created"

      - name: Verify ARM toolchain
        run: |
          echo "🔍 Verifying ARM toolchain..."
          echo ""
          echo "ARM GCC Version:"
          arm-none-eabi-gcc --version | head -n1
          echo ""
          echo "ARM G++ Version:"
          arm-none-eabi-g++ --version | head -n1
          echo ""
          echo "ARM Binutils:"
          arm-none-eabi-as --version | head -n1
          echo ""
          echo "Toolchain location:"
          which arm-none-eabi-gcc
          echo ""
          echo "✅ ARM toolchain validated"

      - name: Set NXP_GCC_PATH for Conan profile
        run: |
          echo "Setting NXP_GCC_PATH environment variable..."
          toolchain_path="$(dirname "$(command -v arm-none-eabi-gcc)")"
          echo "NXP_GCC_PATH=$toolchain_path" >> $GITHUB_ENV
          echo "✅ NXP_GCC_PATH=$toolchain_path"

      - name: Validate ARM profile environment variables
        run: |
          echo "🔍 Validating ARM profile environment variables..."

          profile=".conan/profiles/s32k1x_arm_cortex_m4"

          env_vars=$(grep -oP '\(env\)\K[A-Z_]+' "$profile" || true)

          if [ -n "$env_vars" ]; then
            for var in $env_vars; do
              if [ -z "${!var}" ]; then
                echo "  ❌ $var is required but not set"
                exit 1
              else
                echo "  ✅ $var=${!var}"
              fi
            done
          fi

          echo "✅ All required environment variables are set"

      - name: Validate Conan ARM profile with environment
        run: |
          echo "🔍 Validating Conan ARM profile with resolved environment..."

          profile=".conan/profiles/s32k1x_arm_cortex_m4"
          abs_profile="$(pwd)/$profile"

          echo "Running: poetry run conan profile show -pr=\"$abs_profile\""
          if ! poetry run conan profile show -pr="$abs_profile" > /tmp/conan_profile_output.txt 2>&1; then
            echo "❌ Conan cannot load profile. Error output:"
            cat /tmp/conan_profile_output.txt
            exit 1
          fi
          echo "✅ Conan can load profile"

          echo ""
          echo "Validating ARM-specific settings in resolved profile..."
          profile_output=$(cat /tmp/conan_profile_output.txt)

          if ! echo "$profile_output" | grep -q "os=baremetal"; then
            echo "❌ Missing os=baremetal for embedded target"
            exit 1
          fi
          echo "  ✅ os=baremetal"

          if ! echo "$profile_output" | grep -q "arch=armv7hf"; then
            echo "❌ Missing arch=armv7hf for hard-float Cortex-M4"
            exit 1
          fi
          echo "  ✅ arch=armv7hf"

          if ! echo "$profile_output" | grep -q "compiler=gcc"; then
            echo "❌ Missing compiler=gcc"
            exit 1
          fi
          echo "  ✅ compiler=gcc"

          echo ""
          echo "✅ Conan ARM profile fully validated"

      - name: Build ARM firmware
        run: |
          set -o pipefail
          echo "🔨 Building ARM firmware for S32K144 (Cortex-M4)..."
          echo ""
          echo "SDK headers are bundled in bsp/platform_sdk/ — no S32DS install required."
          echo ""
          make build_all_tgt ARM_BUILD_TYPE=Release 2>&1 | tee arm_build.log
          echo "✅ ARM build completed"

      - name: Verify build artifacts
        if: success()
        run: |
          echo "📦 Checking ARM build artifacts..."

          bin_dir="build_s32k1/build_armv7/Release/bin"  # ARM_BUILD_TYPE=Release set at build step

          if [ ! -d "$bin_dir" ]; then
            echo "❌ ARM bin directory not found: $bin_dir"
            echo ""
            echo "Build tree:"
            find build_s32k1 -maxdepth 5 2>/dev/null | sort || echo "(build_s32k1 does not exist)"
            exit 1
          fi

          echo "✅ ARM bin directory created"
          ls -lh "$bin_dir/"

          for ext in elf hex bin; do
            artifact="$bin_dir/s32k144_firmware.$ext"
            if [ -f "$artifact" ]; then
              echo "✅ $artifact ($(du -h "$artifact" | cut -f1))"
            else
              echo "❌ Missing artifact: $artifact"
              exit 1
            fi
          done

      - name: Validate ARM binary architecture
        if: success()
        run: |
          echo "🔍 Validating ARM binary architecture..."

          object_count=$(find build_s32k1 -name "*.o" 2>/dev/null | wc -l)
          archive_count=$(find build_s32k1 -name "*.a" 2>/dev/null | wc -l)

          if [ "$object_count" -eq 0 ] && [ "$archive_count" -eq 0 ]; then
            echo "⚠️  No ARM object files or archives found to validate"
            exit 0
          fi

          echo "Found: $object_count object file(s), $archive_count archive(s)"
          echo ""
          validation_failed=0

          if [ "$object_count" -gt 0 ]; then
            echo "Checking architecture of object files:"
            while IFS= read -r -d '' obj; do
              arch_info=$(file "$obj")
              if echo "$arch_info" | grep -qiE "ARM|Thumb"; then
                echo "  ✅ $(basename "$obj"): ARM"
              elif echo "$arch_info" | grep -qiE "x86|80386|x86-64"; then
                echo "  ❌ $(basename "$obj"): x86 binary detected in ARM build!"
                validation_failed=1
              fi
            done < <(find build_s32k1 -name "*.o" -print0 2>/dev/null)
          fi

          if [ $validation_failed -eq 1 ]; then
            echo ""
            echo "❌ ARM architecture validation failed!"
            exit 1
          fi

          echo ""
          echo "✅ All ARM binaries validated successfully"

      - name: Upload ARM build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arm-build-artifacts
          path: |
            build_s32k1/build_armv7/Release/bin/  # ARM_BUILD_TYPE=Release set at build step
            arm_build.log
          retention-days: 7

  build:
    name: Build & Compile (GCC)
    runs-on: ubuntu-latest
    needs: lint-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      
      - name: Setup GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 100
      
      - name: Install dependencies
        run: |
          sudo apt-get install -y cmake ninja-build python3 python3-pip
          pip3 install "conan>=2.0"
      
      - name: Install Conan dependencies
        run: |
          mkdir -p build
          cd build
          conan install .. --output-folder=. --build=missing -s build_type=${{ env.BUILD_TYPE }} -pr:h ../.conan/profiles/c_cpp_workspace_linux -pr:b ../.conan/profiles/c_cpp_workspace_linux
      
      - name: Configure CMake with warning flags
        run: |
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build_x86_64/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -pedantic" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror -pedantic"
      
      - name: Build project
        run: |
          cd build
          echo "🔨 Building project..."
          
          # Build and capture output
          if ! ninja 2>&1 | tee build_output.log; then
            echo "❌ Build failed with errors"
            exit 1
          fi
          
          # Check for warnings in build output
          if grep -i "warning:" build_output.log; then
            echo "❌ Build completed but contains warnings"
            echo "All warnings must be fixed"
            exit 1
          fi
          
          echo "✅ Build completed successfully with no warnings"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/
            !build/conan/
            !build/_deps/
          retention-days: 7

  conan-package:
    name: Conan Package Creation & Test
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      
      - name: Setup GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 100
      
      - name: Install dependencies
        run: |
          sudo apt-get install -y cmake ninja-build python3 python3-pip
          pip3 install "conan>=2.0"
      
      - name: Create Conan package
        run: |
          echo "📦 Creating Conan package..."
          
          # Create the package
          if ! conan create . --build=missing -s build_type=${{ env.BUILD_TYPE }} -pr:h .conan/profiles/c_cpp_workspace_linux -pr:b .conan/profiles/c_cpp_workspace_linux; then
            echo "❌ Conan package creation failed"
            exit 1
          fi
          
          echo "✅ Conan package created successfully"
      
      - name: Test Conan package
        run: |
          echo "🧪 Testing Conan package with test_package..."
          
          # The test_package should have been run during conan create
          # Let's verify the package is in the cache
          conan search c_cpp_template_workspace
          
          echo "✅ Conan package validated"
      
      - name: Export package info
        run: |
          echo "📋 Package Information:"
          conan search c_cpp_template_workspace -v
          
          # Get package details
          echo ""
          echo "Package details:"
          conan info . || true

  unit-tests:
    name: Unit Tests Execution
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 100
      
      - name: Install dependencies
        run: |
          sudo apt-get install -y cmake ninja-build python3 python3-pip
          pip3 install "conan>=2.0"
      
      - name: Install Conan dependencies
        run: |
          mkdir -p build
          cd build
          conan install .. --output-folder=. --build=missing -s build_type=${{ env.BUILD_TYPE }} -pr:h ../.conan/profiles/c_cpp_workspace_linux -pr:b ../.conan/profiles/c_cpp_workspace_linux
      
      - name: Configure and build with tests
        run: |
          cd build
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=build_x86_64/Release/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          ninja
      
      - name: Run unit tests
        run: |
          cd build
          echo "🧪 Running unit tests..."
          
          # Run CTest with verbose output
          if ! ctest --output-on-failure --verbose; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          
          echo "✅ All unit tests passed"
      
      - name: Generate test report
        if: always()
        run: |
          cd build
          ctest --output-junit test-results.xml || true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results.xml
          retention-days: 30

  sonarqube:
    name: SonarQube Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build
    # Run on pushes and PRs from the same repo (not forks) - forks don't have access to SONAR_TOKEN
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # SHA256 checksum of build-wrapper-linux-x86.zip - update when SonarCloud releases new version
      # To get current SHA256: curl -sL https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip | sha256sum
      SONAR_WRAPPER_SHA256: "b27636b7a23d8bc16418bbe5c10adcec96d27faab7d2beed87ec434deea8eeb9"
      # SHA256 checksum of sonar-scanner-cli-6.2.1.4610-linux-x64.zip
      # To get current SHA256: curl -sL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip | sha256sum
      SONAR_SCANNER_SHA256: "0b8a3049f0bd5de7abc1582c78c233960d3d4ed7cc983a1d1635e8552f8bb439"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 100
      
      - name: Install dependencies
        run: |
          sudo apt-get install -y cmake ninja-build python3 python3-pip
          pip3 install "conan>=2.0" gcovr
      
      - name: Install Conan dependencies
        run: |
          mkdir -p build
          cd build
          conan install .. --output-folder=. --build=missing -s build_type=${{ env.BUILD_TYPE }} -pr:h ../.conan/profiles/c_cpp_workspace_linux -pr:b ../.conan/profiles/c_cpp_workspace_linux
      
      - name: Download SonarQube build wrapper
        run: |
          set -euo pipefail
          mkdir -p .sonar
          curl -sSfL -o .sonar/build-wrapper-linux-x86.zip \
            https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          if [ -z "${SONAR_WRAPPER_SHA256:-}" ]; then
            echo "ERROR: SONAR_WRAPPER_SHA256 is not set. Refusing to run unverified build-wrapper binary." >&2
            exit 1
          fi
          echo "${SONAR_WRAPPER_SHA256}  .sonar/build-wrapper-linux-x86.zip" | sha256sum -c
          unzip -o .sonar/build-wrapper-linux-x86.zip -d .sonar/
      
      - name: Configure CMake with coverage flags
        run: |
          cd build
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build_x86_64/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCOVERAGE=ON
      
      - name: Build with SonarQube wrapper
        run: |
          cd build
          ../.sonar/build-wrapper-linux-x86/build-wrapper-linux-x86-64 \
            --out-dir ../bw-output \
            ninja
      
      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage for SonarQube analysis..."
          
          # Run tests
          cd build
          ctest --output-on-failure
          
          # Clean up CMake's internal coverage files to avoid gcovr errors
          find CMakeFiles -name "*.gcno" -delete 2>/dev/null || true
          find CMakeFiles -name "*.gcda" -delete 2>/dev/null || true
          
          # Create coverage directory
          mkdir -p coverage
          
          # Run gcovr to generate SonarQube XML format using gcov matching GCC version
          gcovr --sonarqube coverage/sonarqube.xml \
            --root .. \
            --filter '^src/' \
            --filter '^include/' \
            --exclude '.*test.*' \
            --exclude '.*/googletest/.*' \
            --gcov-executable gcov-${{ env.GCC_VERSION }}
          
          echo "✅ Coverage report generated: coverage/sonarqube.xml"
          
          cd ..
      
      - name: Download and install SonarScanner
        run: |
          set -euo pipefail
          mkdir -p .sonar
          curl -sSfL -o .sonar/sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          
          # Verify SHA256 checksum
          if [ -z "${SONAR_SCANNER_SHA256:-}" ]; then
            echo "ERROR: SONAR_SCANNER_SHA256 is not set. Refusing to run unverified SonarScanner binary." >&2
            exit 1
          fi
          echo "${SONAR_SCANNER_SHA256}  .sonar/sonar-scanner.zip" | sha256sum -c
          
          unzip -o .sonar/sonar-scanner.zip -d .sonar/
          echo "$(pwd)/.sonar/sonar-scanner-6.2.1.4610-linux-x64/bin" >> $GITHUB_PATH
      
      - name: Run SonarQube Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Base parameters for all scans
          SONAR_ARGS=(
            -Dsonar.projectKey=${{ github.repository_owner }}_S32K1X_Workspace
            -Dsonar.organization=rashiqul-sonar-workspace
            -Dsonar.sources=src,include
            -Dsonar.tests=test
            -Dsonar.cfamily.build-wrapper-output=bw-output
            -Dsonar.coverageReportPaths=build/coverage/sonarqube.xml
            -Dsonar.host.url=https://sonarcloud.io
          )
          
          # Add PR-specific parameters if this is a pull request event
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SONAR_ARGS+=(
              -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
              -Dsonar.pullrequest.branch=${{ github.head_ref }}
              -Dsonar.pullrequest.base=${{ github.base_ref }}
            )
            echo "🔍 Running SonarQube analysis for PR #${{ github.event.pull_request.number }}"
          else
            SONAR_ARGS+=(
              -Dsonar.branch.name=${{ github.ref_name }}
            )
            echo "🔍 Running SonarQube analysis for branch ${{ github.ref_name }}"
          fi
          
          sonar-scanner "${SONAR_ARGS[@]}"

  pipeline-summary:
    name: Pipeline Status Summary
    runs-on: ubuntu-latest
    needs: [compliance-checks, environment-check, lint-check, arm-build, build, conan-package, unit-tests]
    if: always()

    steps:
      - name: Check pipeline status
        run: |
          echo "📊 Pipeline Execution Summary"
          echo "=============================="
          echo ""
          echo "Compliance Checks: ${{ needs.compliance-checks.result }}"
          echo "Environment Check: ${{ needs.environment-check.result }}"
          echo "Lint Check: ${{ needs.lint-check.result }}"
          echo "ARM Build (S32K144): ${{ needs.arm-build.result }}"
          echo "Build (x86): ${{ needs.build.result }}"
          echo "Conan Package: ${{ needs.conan-package.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo ""

          if [ "${{ needs.compliance-checks.result }}" != "success" ] || \
             [ "${{ needs.environment-check.result }}" != "success" ] || \
             [ "${{ needs.lint-check.result }}" != "success" ] || \
             [ "${{ needs.arm-build.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.conan-package.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Pipeline failed. Please check the failed jobs above."
            exit 1
          fi

          echo ""
          echo "✅ All critical pipeline checks passed!"
